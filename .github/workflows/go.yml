name: Go

on:
  push:
    branches: [ "workflows", "main" ]
  pull_request:
    branches: [ "workflows", "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v3

    # reads the toolchain line of go.mod, so the file has to be checked out first
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Get dependencies
      run: go mod tidy && go mod vendor

    - name: Build
      run: make build
      env:
        GOFLAGS: "-mod=vendor"

    - name: Test
      run: make test
      env:
        GOFLAGS: "-mod=vendor"

    - name: Lint
      run: make lint

    - name: Docker image
      run: docker build -t zoomrs .