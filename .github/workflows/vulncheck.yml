name: Vulncheck

# New advisories appear without any push, so check weekly even when the repo is idle.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:

  vulncheck:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Vulnerability check
      run: make vulncheck
